; Ein 31-Megapixel-Foto belegt in GD rund 121 MB - das Standardlimit von 128 MB
; reicht dafür nicht. Die Anwendung hebt das Limit notfalls zur Laufzeit selbst
; an; dieser Wert sorgt dafür, dass sie es im Normalbetrieb nicht muss.
memory_limit = 512M

; Fehler gehören ins Protokoll, nicht in die Bildantwort: Eine Fehlermeldung im
; Rumpf einer image.php-Antwort ergibt nur ein kaputtes Bild im Browser.
display_errors = Off
log_errors = On
